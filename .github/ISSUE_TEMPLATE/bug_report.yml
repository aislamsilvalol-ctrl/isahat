name: Bug report
description: Report a problem with IsaHat (not a security vulnerability).
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! For **security vulnerabilities in IsaHat**, do not use
        this form — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I run `isahat scan ...`, I see ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) and config used. Redact any secrets/targets.
      placeholder: |
        1. isahat scan http://127.0.0.1:8123 --yes
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IsaHat version
      description: Output of `isahat version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Python version
      placeholder: macOS 14 / Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant output (with `--verbose` if possible). Mask secrets.
      render: shell
  - type: checkboxes
    id: authorised
    attributes:
      label: Confirmation
      options:
        - label: This report does not include data from an unauthorised target.
          required: true
