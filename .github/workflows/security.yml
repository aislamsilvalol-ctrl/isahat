name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pip-audit cyclonedx-bom

      - name: pip-audit (known vulnerable deps)
        # `isahat` is not published on PyPI. A bare `pip-audit --strict` always
        # fails collection on that editable install, which is not an advisory.
        # Freeze everything except the editable project and audit those pins.
        # `--strict` still fails the job when a dependency is vulnerable or
        # cannot be audited. Do not append `|| true`.
        run: |
          python -m pip freeze --exclude-editable > "${RUNNER_TEMP:-/tmp}/audit-reqs.txt"
          pip-audit --strict --no-deps -r "${RUNNER_TEMP:-/tmp}/audit-reqs.txt"

      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py environment --output-format json --outfile sbom.json || true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
