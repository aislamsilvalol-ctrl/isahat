[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "isahat"
version = "0.1.0"
description = "IsaHat — Open Source AI Security Auditor for Vibe-Coded Applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "IsaHat Contributors" }]
keywords = [
    "security",
    "appsec",
    "scanner",
    "auditor",
    "owasp",
    "devsecops",
    "vulnerability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/aislamsilvalol-ctrl/isahat"
Repository = "https://github.com/aislamsilvalol-ctrl/isahat"
Documentation = "https://github.com/aislamsilvalol-ctrl/isahat/tree/main/docs"
Issues = "https://github.com/aislamsilvalol-ctrl/isahat/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
isahat = "isahat.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/isahat"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# UP042: we intentionally use (str, Enum) rather than StrEnum to keep repr/str
# semantics and attach helper methods; E501: line length handled by formatter.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# B008: Typer's documented pattern is to call typer.Option/Argument in defaults.
"src/isahat/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/isahat"]
